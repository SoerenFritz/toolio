

services:

  db:
    image: mariadb:11
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: moodle
      MYSQL_USER: moodle
      MYSQL_PASSWORD: moodle
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql

  moodle:
    image: moodlehq/moodle-php-apache:8.2
    container_name: moodle-dev-server
    ports:
      - "8080:80"
    volumes:
      - moodle_core:/var/www/moodle
      - ./local-plugins:/var/www/moodle/local
      - moodledata:/var/www/moodledata
      - ./php-overrides.ini:/usr/local/etc/php/conf.d/99-overrides.ini
    environment:
      PHP_DISPLAY_ERRORS: 1
      MOODLE_DEBUG: 1
      APACHE_DOCUMENT_ROOT: /var/www/moodle/public
      MOODLE_DATABASE_TYPE: mariadb
      MOODLE_DATABASE_HOST: db
      MOODLE_DATABASE_NAME: moodle
      MOODLE_DATABASE_USER: moodle
      MOODLE_DATABASE_PASSWORD: moodle
      MOODLE_DEFAULT_LANGUAGE: "de"
      LC_ALL: de_DE.UTF-8
    depends_on:
      - db
    restart: always

  app:
    image: moodlehq/moodleapp:latest
    container_name: moodle-mobile-app
    ports:
      - "8100:443"
    environment:
      MOODLE_URL: http://host.docker.internal:8080
    depends_on:
      - moodle
    restart: always

volumes:
  moodle_core:
  moodledata:
  db_data: